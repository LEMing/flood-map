<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Flood Map — rain &amp; flood simulation</title>
    <style>
      :root {
        color-scheme: dark;
        --panel-bg: rgba(18, 22, 28, 0.82);
        /* Floating-chrome design tokens — shared by every glass pill so the
           top bar, dock and HUD read as one system. */
        --pill-radius: 10px;
        --pill-blur: 6px;
        --pill-border: #2a313b;
        --ctl-h: 40px;        /* desktop control height */
        --ctl-h-touch: 44px;  /* mobile touch target (Apple HIG / WCAG 2.5.5) */
        --safe-t: env(safe-area-inset-top);
        --safe-b: env(safe-area-inset-bottom);
        --safe-l: env(safe-area-inset-left);
        --safe-r: env(safe-area-inset-right);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #0b0e13; }
      body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #e6edf3; }
      #scene { position: fixed; inset: 0; display: block; touch-action: none; }

      #addressbar {
        position: fixed; z-index: 10;
        top: calc(12px + var(--safe-t)); left: calc(12px + var(--safe-l));
        display: flex; gap: 6px; align-items: center;
        background: var(--panel-bg); backdrop-filter: blur(var(--pill-blur));
        padding: 0 6px; min-height: var(--ctl-h); border-radius: var(--pill-radius);
        box-shadow: 0 4px 18px rgba(0,0,0,.4);
        max-width: min(520px, calc(100vw - 24px));
      }
      #ac-wrap { position: relative; flex: 1 1 auto; min-width: 0; }
      #addressbar input {
        width: 320px; max-width: 52vw; padding: 7px 10px; border-radius: 7px;
        border: 1px solid var(--pill-border); background: #0e1318; color: #e6edf3; font-size: 16px;
      }
      #addressbar button {
        padding: 7px 14px; border-radius: 7px; border: 1px solid #2f6feb;
        background: #2f6feb; color: white; font-size: 14px; cursor: pointer;
      }
      #addressbar button:disabled { opacity: .5; cursor: default; }
      /* Phones: full-width search row at a 44px touch height. The top-right
         corner is reserved for the language picker (right: 60px) + ⚙ gear
         (right: 12px); the Load button collapses to a → glyph to free width.
         (These overrides MUST follow the base button rule above to win source order.) */
      @media (max-width: 767px) {
        #addressbar {
          left: calc(12px + var(--safe-l)); right: calc(136px + var(--safe-r));
          max-width: none; min-height: var(--ctl-h-touch);
        }
        #ac-wrap { flex: 1 1 auto; }
        #addressbar input { width: 100%; max-width: none; }
        #addressbar button {
          width: var(--ctl-h-touch); min-height: var(--ctl-h-touch);
          padding: 0; font-size: 0;
        }
        #addressbar button::after { content: "→"; font-size: 18px; line-height: 1; }
        [dir="rtl"] #addressbar button::after { content: "←"; }
        /* 44px touch rows; .lang-item flex-centers, .ac-item centers via padding
           (it's a block — symmetric padding keeps the text middle without
           breaking its ellipsis truncation). */
        .lang-item { min-height: var(--ctl-h-touch); }
        .ac-item { padding-top: 13px; padding-bottom: 13px; }
      }
      /* Neutralize the iOS grey tap-flash + 300ms double-tap delay on chrome. */
      #addressbar button, #lang-trigger, #chrome-toggle, .ac-item, .lang-item {
        -webkit-tap-highlight-color: transparent; touch-action: manipulation;
      }

      /* Language picker — top-right, just left of the settings gear. The panel
         is a drawer on every viewport now, so the picker always sits beside it. */
      #lang-picker { position: fixed; top: calc(12px + var(--safe-t)); right: calc(64px + var(--safe-r)); z-index: 13; }
      #lang-trigger {
        display: flex; align-items: center; gap: 6px; line-height: 1;
        padding: 0 12px; height: var(--ctl-h); border-radius: var(--pill-radius); cursor: pointer;
        border: 1px solid var(--pill-border); background: var(--panel-bg);
        backdrop-filter: blur(var(--pill-blur)); color: #cdd6e0; font-size: 13px;
        box-shadow: 0 4px 18px rgba(0,0,0,.4); transition: border-color .15s, color .15s;
      }
      /* Match the 44px touch height on phones (after the base rule, to win source order). */
      @media (max-width: 767px) { #lang-trigger { height: var(--ctl-h-touch); } }
      #lang-trigger:hover { border-color: #3a4250; color: #fff; }
      #lang-trigger .globe { font-size: 14px; }
      #lang-trigger .code { font-weight: 600; letter-spacing: .3px; }
      #lang-pop {
        position: absolute; top: calc(100% + 6px); right: 0; width: 240px; max-width: calc(100vw - 24px);
        background: rgba(14, 19, 24, 0.98); border: 1px solid #2a313b; border-radius: 10px;
        box-shadow: 0 12px 32px rgba(0,0,0,.55); overflow: hidden;
      }
      #lang-pop[hidden] { display: none; }
      #lang-search {
        width: 100%; padding: 9px 11px; border: none; border-bottom: 1px solid #1b222c;
        background: #0e1318; color: #e6edf3; font-size: 16px; outline: none;
      }
      #lang-list { max-height: 340px; overflow-y: auto; }
      #lang-list::-webkit-scrollbar { width: 8px; }
      #lang-list::-webkit-scrollbar-thumb { background: #2a313b; border-radius: 4px; }
      .lang-item {
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        padding: 8px 11px; font-size: 13px; color: #cdd6e0; cursor: pointer;
      }
      .lang-item .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .lang-item .lc { flex: 0 0 auto; font-size: 11px; color: #6b7785; text-transform: uppercase; }
      .lang-item.current .name { color: #6cb1ff; }
      .lang-item.active { background: #1f6feb; color: #fff; }
      .lang-item.active .lc { color: #cfe0ff; }
      .lang-item.active .name { color: #fff; }

      #ac-list {
        position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20;
        background: rgba(14, 19, 24, 0.98); border: 1px solid #2a313b; border-radius: 8px;
        overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.5); display: none;
      }
      .ac-item {
        padding: 8px 10px; font-size: 13px; color: #cdd6e0; cursor: pointer;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        border-bottom: 1px solid #1b222c;
      }
      .ac-item:last-child { border-bottom: none; }
      .ac-item.active, .ac-item:hover { background: #1f6feb; color: #fff; }

      /* ── Game UI ──────────────────────────────────────────────── */
      /* Center launch overlay — shown until the first run, then hidden. Sits
         below the top-bar popups (lang z13, ac-list z20) so an opened menu
         covers it instead of the Play button poking through; the gear drawer
         (z10) additionally hides it via body.chrome-open below. */
      #start-overlay {
        position: fixed; inset: 0; z-index: 12; pointer-events: none;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      }
      #start-overlay[hidden] { display: none; }
      #start-btn {
        pointer-events: auto; display: inline-flex; align-items: center; gap: 12px;
        min-height: 56px; padding: 16px 30px; border-radius: 999px; cursor: pointer;
        border: 1px solid rgba(120,170,255,.5);
        background: linear-gradient(180deg, rgba(47,111,235,.96), rgba(30,86,200,.96));
        color: #fff; font-size: 19px; font-weight: 700; letter-spacing: .3px;
        box-shadow: 0 10px 40px rgba(47,111,235,.5), 0 2px 10px rgba(0,0,0,.5);
        transition: transform .12s ease, box-shadow .15s, filter .15s;
        touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      }
      #start-btn:hover { filter: brightness(1.08); box-shadow: 0 14px 50px rgba(47,111,235,.62); }
      #start-btn:active { transform: scale(.97); }
      #start-overlay .sub {
        color: rgba(230,237,243,.72); font-size: 13px; letter-spacing: .4px;
        max-width: min(90vw, 520px); padding: 0 16px; text-align: center; text-wrap: balance;
        text-shadow: 0 1px 4px rgba(0,0,0,.6);
      }

      /* Bottom-center dock — pause/resume + restart, shown after start. */
      #game-dock {
        position: fixed; bottom: calc(18px + var(--safe-b)); left: 50%; transform: translateX(-50%);
        z-index: 12; display: flex; gap: 8px; align-items: center; padding: 6px;
        border-radius: 999px; background: var(--panel-bg); backdrop-filter: blur(var(--pill-blur));
        box-shadow: 0 4px 18px rgba(0,0,0,.45);
      }
      #game-dock[hidden] { display: none; }
      #game-dock button {
        display: inline-flex; align-items: center; justify-content: center;
        width: 46px; height: 46px; border-radius: 50%; cursor: pointer;
        border: 1px solid #2a313b; background: rgba(255,255,255,.03);
        color: #e6edf3; font-size: 18px; line-height: 1;
        transition: border-color .15s, background .15s, color .15s;
        touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      }
      #game-dock button:hover { border-color: #3a4250; background: rgba(255,255,255,.08); }
      #game-dock #btn-pause {
        border-color: #2f6feb; background: #1f6feb; color: #fff; box-shadow: 0 2px 14px rgba(47,111,235,.45);
      }
      #game-dock #btn-pause:hover { background: #2f6feb; }

      /* Bottom-left flood readout HUD. */
      #hud-stats {
        position: fixed; bottom: calc(26px + var(--safe-b)); left: calc(14px + var(--safe-l));
        z-index: 11; pointer-events: none;
        display: flex; align-items: center; gap: 7px;
        background: rgba(12,16,22,.62); backdrop-filter: blur(6px);
        padding: 7px 13px; border-radius: 999px; font-size: 13px; color: #e6edf3;
        font-variant-numeric: tabular-nums; border: 1px solid rgba(255,255,255,.08);
        box-shadow: 0 2px 10px rgba(0,0,0,.4);
      }
      #hud-stats[hidden] { display: none; }
      #hud-stats .wave { font-size: 14px; }
      #hud-stats .sep { opacity: .4; }
      #hud-stats .v { font-weight: 600; }

      @media (max-width: 767px) {
        #game-dock { bottom: calc(14px + var(--safe-b)); }
        #game-dock button { width: 50px; height: 50px; }
        #hud-stats {
          bottom: calc(72px + var(--safe-b)); left: calc(12px + var(--safe-l));
          max-width: calc(50vw - 16px);
        }
        #start-btn { font-size: 18px; padding: 16px 26px; }
      }

      .poi-label {
        position: fixed; z-index: 8; pointer-events: none;
        transform: translate(-50%, -130%);
        background: rgba(229, 68, 58, 0.92); color: #fff;
        font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px;
        white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.5); display: none;
      }

      /* District marker: dark glass pill with a glowing red edge + note icon */
      .poi-district {
        position: fixed; z-index: 8; pointer-events: none; display: none;
        transform: translate(0, -100%);
        align-items: center; gap: 7px;
        background: rgba(16, 19, 26, 0.82); backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 86, 70, 0.85); border-radius: 999px;
        box-shadow: 0 0 16px rgba(255, 70, 55, 0.5), 0 2px 10px rgba(0,0,0,.55);
        color: #fff; font-size: 12px; font-weight: 600; letter-spacing: .2px;
        padding: 5px 12px 5px 6px; white-space: nowrap;
      }
      .poi-district .note {
        display: inline-flex; align-items: center; justify-content: center;
        width: 20px; height: 20px; border-radius: 50%;
        background: radial-gradient(circle at 50% 35%, #ff6f5d, #e5443a);
        color: #fff; font-size: 12px; line-height: 1;
        box-shadow: 0 0 10px rgba(255, 70, 55, 0.85);
      }
      .poi-leader {
        position: fixed; z-index: 7; pointer-events: none; display: none;
        height: 2px; transform-origin: left center;
        background: linear-gradient(90deg,
          rgba(255, 110, 90, 0.95) 0%, rgba(255, 86, 70, 0.55) 100%);
        box-shadow: 0 0 8px rgba(255, 70, 55, 0.7);
      }

      #toast {
        position: fixed; top: 64px; left: 12px; z-index: 10;
        background: var(--panel-bg); backdrop-filter: blur(6px);
        padding: 8px 12px; border-radius: 8px; font-size: 13px;
        max-width: min(520px, calc(100vw - 24px));
        opacity: 0; transition: opacity .25s; pointer-events: none;
        border-left: 3px solid #2f6feb;
      }
      #toast.show { opacity: 1; }
      #toast.error { border-left-color: #e5534b; }

      #credit {
        position: fixed; bottom: 6px; left: 8px; z-index: 9;
        font-size: 11px; color: rgba(255,255,255,.7);
        text-shadow: 0 1px 2px rgba(0,0,0,.8); pointer-events: none;
        display: none;
      }

      #fps-meter {
        position: fixed; bottom: calc(14px + var(--safe-b)); right: calc(14px + var(--safe-r));
        z-index: 11; pointer-events: none;
        font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: .3px; color: #86e08a;
        background: rgba(12, 16, 22, 0.55); backdrop-filter: blur(6px);
        padding: 5px 9px; border-radius: 999px;
        border: 1px solid rgba(255,255,255,.07);
      }
      @media (max-width: 767px) {
        #fps-meter { bottom: calc(72px + var(--safe-b)); right: calc(12px + var(--safe-r)); }
      }

      #readout {
        position: fixed; z-index: 11; pointer-events: none; display: none;
        background: rgba(18, 22, 28, 0.85); color: #e6edf3;
        padding: 5px 9px; border-radius: 6px; font-size: 12px;
        font-variant-numeric: tabular-nums; white-space: nowrap;
        box-shadow: 0 2px 10px rgba(0,0,0,.4);
      }

      #legend {
        position: fixed; bottom: 30px; left: 12px; z-index: 9; display: none;
        background: rgba(18, 22, 28, 0.82); padding: 8px 10px; border-radius: 8px;
        font-size: 11px; color: #e6edf3; box-shadow: 0 2px 10px rgba(0,0,0,.4);
      }
      #legend .title { margin-bottom: 5px; opacity: .85; }
      #legend .bar {
        width: 200px; height: 10px; border-radius: 3px;
        background: linear-gradient(to right,
          #07154d, #1f6fe5, #18c7c0, #3fdd54, #f2e020, #f58a1f, #d11414);
      }
      #legend .labels {
        display: flex; justify-content: space-between; margin-top: 3px;
        font-variant-numeric: tabular-nums;
      }

      /* Geology legend — now docked inside the controls drawer, under the panel. */
      #geo-legend {
        display: none;
        background: rgba(18, 22, 28, 0.86); backdrop-filter: blur(6px);
        padding: 9px 11px; border-radius: 8px; color: #e6edf3;
        font-size: 11px; box-shadow: 0 2px 10px rgba(0,0,0,.45);
        width: 100%;
      }
      #geo-legend.visible { display: block; }
      #geo-legend .title { font-weight: 600; margin-bottom: 6px; opacity: .9; }
      #geo-legend .row { display: flex; align-items: center; gap: 7px; margin: 2px 0; }
      #geo-legend .sw {
        width: 13px; height: 13px; border-radius: 3px; flex: 0 0 auto;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.15);
      }
      #geo-legend .nm { flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #geo-legend .dp { opacity: .7; font-variant-numeric: tabular-nums; white-space: nowrap; }
      #geo-legend .tg {
        font-size: 9px; padding: 1px 5px; border-radius: 999px; flex: 0 0 auto;
        text-transform: uppercase; letter-spacing: .3px;
      }
      #geo-legend .tg.soilgrids { background: rgba(63, 182, 224, .22); color: #8fdcf5; }
      #geo-legend .tg.model, #geo-legend .tg.crust1, #geo-legend .tg.regional { background: rgba(255,255,255,.10); color: #b9c2cc; }
      #geo-legend .row.wt .nm { color: #8fdcf5; }
      #geo-legend .caveat { margin-top: 7px; opacity: .6; font-size: 10px; line-height: 1.35; }

      /* ── Controls chrome ──
         Layout + responsive behaviour live as Tailwind utilities on the markup
         (#chrome-panel / #chrome-toggle). These rules cover only what utilities
         can't express cleanly: the scrollbar skin, Tweakpane's mounted width,
         and the body-state that collapses the drawer (closed by default on
         every viewport — the clean game UI opens it via the ⚙ gear). */
      #chrome-panel {
        overscroll-behavior: contain;
        scrollbar-width: thin; scrollbar-color: #2a313b transparent;
      }
      #chrome-panel::-webkit-scrollbar { width: 8px; }
      #chrome-panel::-webkit-scrollbar-thumb { background: #2a313b; border-radius: 4px; }
      #tp-mount .tp-rotv { width: 100%; }

      body:not(.chrome-open) #chrome-panel { display: none; }
      /* Opening any top-bar menu (gear drawer or language popup) hides the
         pre-launch Play CTA so it can't show through the menu. */
      body.chrome-open #start-overlay:not([hidden]),
      body.lang-open #start-overlay:not([hidden]) { display: none; }

    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="addressbar">
      <div id="ac-wrap">
        <input id="address-input" type="text" placeholder="Enter an address or place…" autocomplete="off" spellcheck="false" />
        <div id="ac-list"></div>
      </div>
      <button id="address-go">Load</button>
    </div>
    <div id="toast"></div>
    <div id="credit">Imagery © Esri, Maxar, Earthstar Geographics &amp; the GIS User Community</div>
    <div id="readout"></div>
    <div id="legend">
      <div class="title">Elevation</div>
      <div class="bar"></div>
      <div class="labels"><span id="legend-min">0 m</span><span id="legend-max">0 m</span></div>
    </div>

    <!-- Game UI: one-button launch, then a floating pause/restart dock + flood HUD.
         Labels are set from i18n in GameUI.ts; icons stay literal. -->
    <div id="start-overlay">
      <button id="start-btn" type="button">
        <span class="start-label">Play ▶</span>
      </button>
      <div class="sub"></div>
    </div>
    <div id="game-dock" hidden>
      <button id="btn-pause" type="button" aria-label="Pause">⏸</button>
      <button id="btn-restart" type="button" aria-label="Restart">↻</button>
    </div>
    <div id="hud-stats" hidden>
      <span class="wave">🌊</span>
      <span class="v" id="hud-depth">0.0 m</span>
      <span class="sep">·</span>
      <span class="v" id="hud-area">0%</span>
    </div>

    <!-- Settings gear — always visible; opens the controls drawer (icon-only:
         ⚙ closed / ✕ open — no translatable text). -->
    <button
      id="chrome-toggle"
      type="button"
      aria-label="Toggle controls"
      aria-expanded="false"
      class="fixed top-[calc(0.75rem+env(safe-area-inset-top))] right-[calc(0.75rem+env(safe-area-inset-right))]
             z-[13] flex h-10 w-10 max-md:h-11 max-md:w-11 items-center justify-center
             rounded-[10px] border border-[#2a313b] bg-[var(--panel-bg)] text-[18px]
             leading-none text-[#e6edf3] backdrop-blur-[6px] shadow-[0_4px_18px_rgba(0,0,0,.4)]
             cursor-pointer hover:border-[#3a4250]"
    >⚙</button>
    <!-- Right-side controls drawer: Tweakpane mounts in #tp-mount, geology legend docks below it. -->
    <aside
      id="chrome-panel"
      class="fixed top-[calc(60px+env(safe-area-inset-top))] right-3 z-10 flex w-64 flex-col gap-2.5 overflow-y-auto
             max-h-[calc(100dvh-72px)]
             max-md:w-[min(320px,calc(100vw-24px))]
             max-md:rounded-xl max-md:p-1
             max-md:bg-[rgba(11,14,19,0.55)] max-md:backdrop-blur-sm"
    >
      <div id="tp-mount" class="relative"></div>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
