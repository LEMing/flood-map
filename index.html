<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Flood Map — rain &amp; flood simulation</title>
    <style>
      :root {
        color-scheme: dark;
        --panel-bg: rgba(14, 18, 24, 0.78);
        --panel-bg-strong: rgba(11, 15, 20, 0.9);
        --panel-border: rgba(226, 237, 255, 0.12);
        --panel-border-strong: rgba(226, 237, 255, 0.18);
        --panel-shadow: 0 12px 34px rgba(0, 0, 0, 0.36);
        --accent: #3b6df6;
        --accent-strong: #2f5fe3;
        /* Floating-chrome design tokens — shared by every glass pill so the
           top bar, dock and HUD read as one system. */
        --pill-radius: 8px;
        --pill-blur: 14px;
        --pill-border: var(--panel-border);
        --ctl-h: 40px;        /* desktop control height */
        --ctl-h-touch: 48px;  /* mobile touch target (Apple HIG / WCAG 2.5.5) */
        --search-card-w: 436px;
        --mobile-gutter: 12px;
        --safe-t: env(safe-area-inset-top);
        --safe-b: env(safe-area-inset-bottom);
        --safe-l: env(safe-area-inset-left);
        --safe-r: env(safe-area-inset-right);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #091015; }
      body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #e6edf3; }
      #scene { position: fixed; inset: 0; display: block; touch-action: none; }
      @keyframes spin { to { transform: rotate(360deg); } }

      #addressbar {
        position: fixed; z-index: 10;
        top: calc(12px + var(--safe-t)); left: calc(12px + var(--safe-l));
        display: flex; gap: 4px; align-items: center;
        background: var(--panel-bg); backdrop-filter: blur(var(--pill-blur));
        -webkit-backdrop-filter: blur(var(--pill-blur));
        padding: 3px 4px; min-height: var(--ctl-h); border-radius: var(--pill-radius);
        border: 1px solid var(--pill-border);
        box-shadow: var(--panel-shadow);
        width: min(var(--search-card-w), calc(100vw - 24px));
        max-width: min(560px, calc(100vw - 24px));
        transition: opacity .18s ease, transform .18s ease;
      }
      #ac-wrap { position: relative; flex: 1 1 auto; min-width: 0; }
      #addressbar input {
        width: 390px; max-width: min(52vw, 472px); height: 32px;
        padding: 0 12px; border-radius: 6px;
        border: 1px solid transparent; background: rgba(7, 11, 16, .8); color: #edf4fb; font-size: 16px;
        outline: none;
        transition: background .16s ease, border-color .16s ease, box-shadow .16s ease;
      }
      #addressbar input:focus {
        border-color: rgba(86, 139, 255, .55);
        box-shadow: inset 0 0 0 1px rgba(59, 109, 246, .3);
        background: rgba(7, 11, 16, .92);
      }
      #addressbar button {
        position: relative;
        width: 32px; height: 32px; flex: 0 0 32px;
        display: inline-flex; align-items: center; justify-content: center;
        padding: 0; border-radius: 50%; border: 1px solid rgba(112, 154, 255, .45);
        background: var(--accent); color: white; font-size: 0; font-weight: 650; cursor: pointer;
        box-shadow: 0 7px 16px rgba(47, 95, 227, .28);
        transition: transform .12s ease, filter .16s ease, background .16s ease, opacity .16s ease;
      }
      #addressbar button::after {
        content: "→";
        display: inline-block;
        font-size: 18px;
        line-height: 1;
        transform: translateY(-1px);
      }
      [dir="rtl"] #addressbar button::after { content: "←"; }
      #addressbar button[data-busy]::after {
        content: "";
        display: block;
        width: 14px; height: 14px;
        border: 2px solid rgba(255,255,255,.4);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin .75s linear infinite;
        transform: none;
      }
      #addressbar button:hover:not(:disabled) { filter: brightness(1.06); }
      #addressbar button:active:not(:disabled) { transform: translateY(1px) scale(.98); }
      #addressbar button:disabled { opacity: .72; cursor: default; }
      /* Phones: full-width search row at a 44px touch height. The top-right
         corner is reserved for the language picker (right: 60px) + ⚙ gear
         (right: 12px); the Load button collapses to a → glyph to free width.
         (These overrides MUST follow the base button rule above to win source order.) */
      @media (max-width: 767px) {
        #addressbar {
          top: calc(10px + var(--safe-t));
          left: calc(var(--mobile-gutter) + var(--safe-l));
          right: calc(138px + var(--safe-r));
          width: auto; max-width: none; min-height: var(--ctl-h-touch); height: var(--ctl-h-touch);
          padding: 4px; gap: 4px;
          background: rgba(10, 14, 19, .74);
          border-color: rgba(255, 255, 255, .13);
        }
        #ac-wrap { flex: 1 1 auto; }
        #addressbar input {
          width: 100%; max-width: none; height: 100%;
          border: 0; box-shadow: none; background: transparent;
          padding: 0 10px 0 12px; font-size: 16px; font-weight: 620;
          min-width: 0; text-overflow: ellipsis;
        }
        #addressbar input::placeholder { color: rgba(231, 238, 247, .54); font-weight: 520; }
        #addressbar input:focus { box-shadow: none; }
        /* A circular send button floating with a uniform 4px frame inside the
           pill (echoes the round dock buttons) — no asymmetric trailing gap. */
        #addressbar button {
          width: 40px; height: 40px; min-height: 0; flex: 0 0 auto;
          border-radius: 50%; padding: 0; font-size: 0;
          box-shadow: 0 8px 18px rgba(47, 95, 227, .34);
        }
        #addressbar button::after { font-size: 22px; }
        #addressbar button[data-busy]::after { width: 16px; height: 16px; }
        /* 44px touch rows; .lang-item flex-centers, .ac-item centers via padding
           (it's a block — symmetric padding keeps the text middle without
           breaking its ellipsis truncation). */
        .lang-item { min-height: var(--ctl-h-touch); }
        .ac-item { padding-top: 13px; padding-bottom: 13px; }
      }
      /* Neutralize the iOS grey tap-flash + 300ms double-tap delay on chrome. */
      #addressbar button, #lang-trigger, #chrome-toggle, .ac-item, .lang-item {
        -webkit-tap-highlight-color: transparent; touch-action: manipulation;
      }
      #addressbar button:focus-visible,
      #lang-trigger:focus-visible,
      #chrome-toggle:focus-visible,
      #game-dock button:focus-visible {
        outline: 2px solid rgba(119, 164, 255, .86);
        outline-offset: 2px;
      }

      /* Language picker — top-right, just left of the settings gear. The panel
         is a drawer on every viewport now, so the picker always sits beside it. */
      #lang-picker {
        position: fixed; top: calc(12px + var(--safe-t)); right: calc(64px + var(--safe-r)); z-index: 13;
        transition: opacity .18s ease, transform .18s ease;
      }
      #lang-trigger {
        display: flex; align-items: center; gap: 6px; line-height: 1;
        padding: 0 12px; height: var(--ctl-h); border-radius: var(--pill-radius); cursor: pointer;
        border: 1px solid var(--pill-border); background: var(--panel-bg);
        backdrop-filter: blur(var(--pill-blur)); -webkit-backdrop-filter: blur(var(--pill-blur));
        color: #d7e0ea; font-size: 13px;
        box-shadow: var(--panel-shadow); transition: border-color .15s, color .15s, background .15s, transform .12s ease;
      }
      /* Match the 44px touch height on phones (after the base rule, to win source order). */
      @media (max-width: 767px) {
        #lang-picker { top: calc(10px + var(--safe-t)); right: calc(68px + var(--safe-r)); }
        #lang-trigger {
          height: var(--ctl-h-touch); min-width: 62px; justify-content: center;
          padding: 0 10px; background: rgba(10, 14, 19, .74);
          border-color: rgba(255, 255, 255, .13);
        }
      }
      #lang-trigger:hover { border-color: var(--panel-border-strong); color: #fff; }
      #lang-trigger:active { transform: translateY(1px) scale(.985); }
      #lang-trigger .globe { font-size: 15px; }
      #lang-trigger .code { font-weight: 700; letter-spacing: 0; }
      #lang-pop {
        position: absolute; top: calc(100% + 6px); right: 0; width: 240px; max-width: calc(100vw - 24px);
        background: var(--panel-bg-strong); border: 1px solid var(--panel-border-strong); border-radius: 8px;
        box-shadow: 0 20px 56px rgba(0,0,0,.52); overflow: hidden;
        backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      }
      #lang-pop[hidden] { display: none; }
      #lang-search {
        width: 100%; padding: 9px 11px; border: none; border-bottom: 1px solid #1b222c;
        background: #0e1318; color: #e6edf3; font-size: 16px; outline: none;
      }
      #lang-list { max-height: 340px; overflow-y: auto; }
      #lang-list::-webkit-scrollbar { width: 8px; }
      #lang-list::-webkit-scrollbar-thumb { background: #2a313b; border-radius: 4px; }
      .lang-item {
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        padding: 8px 11px; font-size: 13px; color: #cdd6e0; cursor: pointer;
      }
      .lang-item .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .lang-item .lc { flex: 0 0 auto; font-size: 11px; color: #6b7785; text-transform: uppercase; }
      .lang-item.current .name { color: #6cb1ff; }
      .lang-item.active { background: #1f6feb; color: #fff; }
      .lang-item.active .lc { color: #cfe0ff; }
      .lang-item.active .name { color: #fff; }
      @media (max-width: 767px) {
        body.lang-open #lang-picker { z-index: 16; }
        #lang-pop {
          position: fixed;
          top: calc(68px + var(--safe-t));
          left: calc(var(--mobile-gutter) + var(--safe-l));
          right: calc(var(--mobile-gutter) + var(--safe-r));
          width: auto; max-width: none;
          max-height: min(430px, calc(100dvh - 92px - var(--safe-t) - var(--safe-b)));
        }
        #lang-list { max-height: min(368px, calc(100dvh - 154px - var(--safe-t) - var(--safe-b))); }
        body.lang-open #addressbar,
        body.lang-open #chrome-toggle {
          opacity: .22;
          pointer-events: none;
        }
      }

      #ac-list {
        position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20;
        background: var(--panel-bg-strong); border: 1px solid var(--panel-border-strong); border-radius: 8px;
        overflow: hidden; box-shadow: 0 14px 36px rgba(0,0,0,.5); display: none;
        backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      }
      .ac-item {
        padding: 8px 10px; font-size: 13px; color: #cdd6e0; cursor: pointer;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        border-bottom: 1px solid #1b222c;
      }
      .ac-item:last-child { border-bottom: none; }
      .ac-item.active, .ac-item:hover { background: #1f6feb; color: #fff; }

      /* ── Game UI ──────────────────────────────────────────────── */
      /* Center launch overlay — shown until the first run, then hidden. Sits
         below the top-bar popups (lang z13, ac-list z20) so an opened menu
         covers it instead of the Play button poking through; the gear drawer
         (z10) additionally hides it via body.chrome-open below. */
      #start-overlay {
        position: fixed; inset: 0; z-index: 12; pointer-events: none;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      }
      #start-overlay[hidden] { display: none; }
      #start-btn {
        pointer-events: auto; display: inline-flex; align-items: center; gap: 12px;
        min-height: 56px; padding: 16px 30px; border-radius: 999px; cursor: pointer;
        border: 1px solid rgba(120,170,255,.5);
        background: linear-gradient(180deg, rgba(59,109,246,.96), rgba(42,86,210,.96));
        color: #fff; font-size: 19px; font-weight: 700; letter-spacing: .3px;
        box-shadow: 0 14px 44px rgba(47,111,235,.42), 0 2px 10px rgba(0,0,0,.5);
        transition: transform .12s ease, box-shadow .15s, filter .15s;
        touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      }
      #start-btn:hover { filter: brightness(1.08); box-shadow: 0 14px 50px rgba(47,111,235,.62); }
      #start-btn:active { transform: scale(.97); }
      #start-overlay .sub {
        color: rgba(230,237,243,.72); font-size: 13px; letter-spacing: .4px;
        max-width: min(90vw, 520px); padding: 0 16px; text-align: center; text-wrap: balance;
        text-shadow: 0 1px 4px rgba(0,0,0,.6);
      }

      /* Bottom-center dock — pause/resume + restart, shown after start. */
      #game-dock {
        position: fixed; bottom: calc(18px + var(--safe-b)); left: 50%; transform: translateX(-50%);
        z-index: 12; display: flex; gap: 8px; align-items: center; padding: 6px;
        border-radius: 999px; background: rgba(11, 15, 20, .78);
        border: 1px solid var(--panel-border);
        backdrop-filter: blur(var(--pill-blur)); -webkit-backdrop-filter: blur(var(--pill-blur));
        box-shadow: 0 14px 38px rgba(0,0,0,.42);
        transition: opacity .18s ease, transform .18s ease;
      }
      #game-dock[hidden] { display: none; }
      #game-dock button {
        display: inline-flex; align-items: center; justify-content: center;
        width: 46px; height: 46px; border-radius: 50%; cursor: pointer;
        border: 1px solid var(--panel-border); background: rgba(255,255,255,.05);
        color: #e6edf3; font-size: 18px; line-height: 1;
        transition: border-color .15s, background .15s, color .15s, transform .12s ease;
        touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      }
      #game-dock button:hover { border-color: var(--panel-border-strong); background: rgba(255,255,255,.09); }
      #game-dock button:active { transform: scale(.96); }
      #game-dock #btn-pause {
        border-color: rgba(126, 164, 255, .5); background: var(--accent); color: #fff; box-shadow: 0 9px 22px rgba(47,111,235,.36);
      }
      #game-dock #btn-pause:hover { background: var(--accent-strong); }

      /* Bottom-left flood readout HUD. */
      #hud-stats {
        position: fixed; bottom: calc(26px + var(--safe-b)); left: calc(14px + var(--safe-l));
        z-index: 11; pointer-events: none;
        display: flex; align-items: center; gap: 7px;
        background: rgba(11,15,20,.68); backdrop-filter: blur(var(--pill-blur));
        -webkit-backdrop-filter: blur(var(--pill-blur));
        padding: 7px 13px; border-radius: 999px; font-size: 13px; color: #e6edf3;
        font-variant-numeric: tabular-nums; border: 1px solid var(--panel-border);
        box-shadow: 0 10px 26px rgba(0,0,0,.32);
        transition: opacity .18s ease, transform .18s ease;
      }
      #hud-stats[hidden] { display: none; }
      #hud-stats .wave { font-size: 14px; }
      #hud-stats .sep { opacity: .4; }
      #hud-stats .v { font-weight: 600; }

      @media (max-width: 767px) {
        body.game-started::after {
          content: "";
          position: fixed;
          left: 0; right: 0; bottom: 0;
          height: min(34dvh, 260px);
          z-index: 8;
          pointer-events: none;
          background:
            linear-gradient(
              to bottom,
              rgba(5, 9, 12, 0) 0%,
              rgba(5, 9, 12, .16) 38%,
              rgba(5, 9, 12, .34) 100%
            );
        }
        #game-dock {
          bottom: calc(42px + var(--safe-b));
          gap: 2px; padding: 5px;
          background: rgba(11, 15, 20, .82);
          box-shadow: 0 16px 42px rgba(0,0,0,.48);
        }
        #game-dock button { width: 44px; height: 44px; font-size: 18px; }
        #game-dock #btn-pause { width: 48px; height: 48px; font-size: 20px; }
        body:not(.game-started) #fps-meter {
          opacity: 0;
          transform: translateY(8px);
        }
        #hud-stats {
          bottom: calc(55px + var(--safe-b));
          left: calc(var(--mobile-gutter) + var(--safe-l));
          width: min(121px, calc(50vw - 66px));
          min-height: 34px; padding: 7px 10px; gap: 5px; font-size: 13px;
          max-width: calc(50vw - 66px - var(--safe-l));
          white-space: nowrap;
          overflow: hidden;
        }
        #hud-stats .wave { font-size: 13px; }
        #hud-stats .sep { margin: 0 -1px; }
        #start-btn { font-size: 18px; padding: 16px 26px; }
      }

      .poi-label {
        position: fixed; z-index: 8; pointer-events: none;
        transform: translate(-50%, -130%);
        background: rgba(229, 68, 58, 0.92); color: #fff;
        font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px;
        white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.5); display: none;
      }

      /* District marker: dark glass pill with a glowing red edge + note icon */
      .poi-district {
        position: fixed; z-index: 8; pointer-events: none; display: none;
        transform: translate(0, -100%);
        align-items: center; gap: 7px;
        background: rgba(16, 19, 26, 0.82); backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 86, 70, 0.85); border-radius: 999px;
        box-shadow: 0 0 16px rgba(255, 70, 55, 0.5), 0 2px 10px rgba(0,0,0,.55);
        color: #fff; font-size: 12px; font-weight: 600; letter-spacing: .2px;
        padding: 5px 12px 5px 6px; white-space: nowrap;
      }
      .poi-district .note {
        display: inline-flex; align-items: center; justify-content: center;
        width: 20px; height: 20px; border-radius: 50%;
        background: radial-gradient(circle at 50% 35%, #ff6f5d, #e5443a);
        color: #fff; font-size: 12px; line-height: 1;
        box-shadow: 0 0 10px rgba(255, 70, 55, 0.85);
      }
      .poi-leader {
        position: fixed; z-index: 7; pointer-events: none; display: none;
        height: 2px; transform-origin: left center;
        background: linear-gradient(90deg,
          rgba(255, 110, 90, 0.95) 0%, rgba(255, 86, 70, 0.55) 100%);
        box-shadow: 0 0 8px rgba(255, 70, 55, 0.7);
      }

      #toast {
        position: fixed; top: 64px; left: 12px; z-index: 10;
        background: rgba(11, 15, 20, .78); backdrop-filter: blur(var(--pill-blur));
        -webkit-backdrop-filter: blur(var(--pill-blur));
        padding: 9px 13px; border-radius: 8px; font-size: 13px;
        min-width: min(300px, calc(100vw - 24px));
        max-width: min(560px, calc(100vw - 24px));
        opacity: 0; transition: opacity .25s; pointer-events: none;
        border: 1px solid var(--panel-border);
        border-left: 3px solid var(--accent);
        box-shadow: 0 12px 30px rgba(0,0,0,.34);
      }
      #toast.show { opacity: 1; }
      #toast.error { border-left-color: #e5534b; }
      @media (max-width: 767px) {
        #toast {
          top: calc(68px + var(--safe-t));
          left: calc(var(--mobile-gutter) + var(--safe-l));
          right: calc(var(--mobile-gutter) + var(--safe-r));
          max-width: none;
          z-index: 15;
        }
      }

      /* Loading card — shown while a world builds (stages + bytes). Text-free
         except the translated header + a universal size unit, so it needs no
         per-locale strings. Sits where the toast does; they hand off on done. */
      #loading-card {
        position: fixed; z-index: 11; pointer-events: none;
        top: calc(64px + var(--safe-t)); left: calc(12px + var(--safe-l));
        width: min(var(--search-card-w), calc(100vw - 24px));
        display: flex; flex-direction: column; gap: 11px;
        padding: 12px 14px; border-radius: 12px; color: #e6edf3;
        background: var(--panel-bg-strong); backdrop-filter: blur(var(--pill-blur));
        -webkit-backdrop-filter: blur(var(--pill-blur));
        border: 1px solid var(--panel-border); box-shadow: var(--panel-shadow);
        opacity: 0; transform: translateY(-6px); transition: opacity .2s ease, transform .2s ease;
      }
      #loading-card[hidden] { display: none; }
      #loading-card.show { opacity: 1; transform: translateY(0); }
      .lc-head { display: flex; align-items: center; gap: 9px; }
      .lc-spin {
        width: 15px; height: 15px; flex: 0 0 auto; border-radius: 50%;
        border: 2px solid rgba(255,255,255,.18); border-top-color: var(--accent);
        animation: spin .8s linear infinite;
      }
      .lc-title {
        flex: 1 1 auto; min-width: 0; font-weight: 600; font-size: 13px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .lc-size { flex: 0 0 auto; font-size: 12px; color: #9fb0c4; font-variant-numeric: tabular-nums; }
      .lc-steps { display: flex; align-items: flex-start; gap: 6px; }
      .lc-step {
        flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 6px;
        opacity: .34; transition: opacity .25s ease;
      }
      .lc-step.active, .lc-step.done { opacity: 1; }
      .lc-ic { font-size: 19px; line-height: 1; filter: grayscale(.7); transition: filter .25s ease; }
      .lc-step.active .lc-ic, .lc-step.done .lc-ic { filter: none; }
      .lc-bar { width: 100%; height: 3px; border-radius: 3px; background: rgba(255,255,255,.12); }
      .lc-step.done .lc-bar { background: var(--accent); }
      .lc-step.active .lc-bar {
        background: linear-gradient(90deg, var(--accent), rgba(59,109,246,.25));
        animation: lc-pulse 1.1s ease-in-out infinite;
      }
      @keyframes lc-pulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
      @media (max-width: 767px) {
        #loading-card {
          top: calc(66px + var(--safe-t));
          left: calc(var(--mobile-gutter) + var(--safe-l));
          right: calc(var(--mobile-gutter) + var(--safe-r));
          width: auto;
        }
      }

      #credit {
        position: fixed; bottom: 6px; left: 8px; z-index: 9;
        font-size: 11px; color: rgba(255,255,255,.7);
        text-shadow: 0 1px 2px rgba(0,0,0,.8); pointer-events: none;
        display: none;
        transition: opacity .18s ease;
      }
      @media (max-width: 767px) {
        #credit {
          bottom: calc(8px + var(--safe-b));
          left: calc(var(--mobile-gutter) + var(--safe-l));
          right: calc(var(--mobile-gutter) + var(--safe-r));
          max-width: none;
          font-size: 10px; line-height: 1.25;
          color: rgba(255,255,255,.68);
        }
      }

      #fps-meter {
        position: fixed; bottom: calc(14px + var(--safe-b)); right: calc(14px + var(--safe-r));
        z-index: 11; pointer-events: none;
        font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0; color: #86e08a;
        background: rgba(11, 15, 20, 0.68); backdrop-filter: blur(var(--pill-blur));

      /* ── Controls chrome ── */
      #chrome-toggle {
        position: fixed;
        top: calc(12px + var(--safe-t));
        right: calc(12px + var(--safe-r));

      /* Opening any top-bar menu (gear drawer or language popup) hides the

      body.chrome-open #start-overlay:not([hidden]),

      @media (max-width: 767px) {

        }
        body.chrome-open #game-dock {

        #chrome-panel {

      @media (max-width: 374px) {

      /* ── Landing ("/") ─────────────────────────────────────────────
         An immersive entry: the chosen place's satellite snapshot fills the
         screen behind a darkening scrim; a glass card holds the search, a few

         canvas + all sim chrome so nothing peeks through. */
      #landing { display: none; }
      body.landing #landing {
        display: block; position: fixed; inset: 0; z-index: 50;
        overflow: hidden; background: #070b10;

      body.landing #scene,

      /* The language picker stays available on the landing; no gear there, so it

      body.landing #lang-picker { right: calc(12px + var(--safe-r)); z-index: 51; }

      .lp-bg {

      .lp-ac {

        backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); display: none;

      .lp-opts { display: flex; flex-direction: column; gap: 11px; }

      .lp-seg {

      .lp-btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 9px;

        font-size: 16px; font-weight: 680; letter-spacing: .2px;

        touch-action: manipulation; -webkit-tap-highlight-color: transparent;

      .lp-btn-ghost {

      .lp-btn-ghost:not(:disabled):hover { background: rgba(255,255,255,.12); border-color: rgba(226,237,255,.32); }
      .lp-btn-ghost[hidden] { display: none; }
      .lp-cta.single { grid-template-columns: 1fr; }

      @media (max-width: 767px) {
        .lp-card {

          width: 100%; border-radius: 20px 20px 0 0;
          padding: 22px 18px calc(20px + var(--safe-b));

        }

        .lp-headline { font-size: 22px; }

      /* ── Cinematic video overlay ───────────────────────────────────
         Progress phase: a light scrim so the storm computing behind shows

      .vm-overlay {

      @keyframes vm-fade { from { opacity: 0; } to { opacity: 1; } }

      @media (max-width: 767px) {
        .vm-actions .vm-btn { flex: 1 1 auto; }
      }

  <body>
    <canvas id="scene"></canvas>

    <!-- Landing surface (route "/"): an immersive satellite backdrop with a glass

    </div>

         Labels are set from i18n in GameUI.ts; icons stay literal. -->

      <button id="start-btn" type="button">
        <span class="start-label">Play ▶</span>
      </button>
      <div class="sub"></div>
    </div>

      <button id="btn-pause" type="button" aria-label="Pause">⏸</button>
      <button id="btn-restart" type="button" aria-label="Restart">↻</button>
    </div>
    <div id="hud-stats" hidden>
      <span class="wave">🌊</span>
      <span class="v" id="hud-depth">0.0 m</span>
      <span class="sep">·</span>
      <span class="v" id="hud-area">0%</span>
    </div>

    <!-- Settings gear — always visible; opens the controls drawer (icon-only:
         ⚙ closed / ✕ open — no translatable text). -->
    <button
      id="chrome-toggle"
      type="button"
      aria-label="Toggle controls"
