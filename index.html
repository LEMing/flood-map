<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flood Map — rain &amp; flood simulation</title>
    <style>
      :root {
        color-scheme: dark;
        --panel-bg: rgba(18, 22, 28, 0.82);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e13; }
      body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #e6edf3; }
      #scene { position: fixed; inset: 0; display: block; }

      #addressbar {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        display: flex; gap: 6px; align-items: center;
        background: var(--panel-bg); backdrop-filter: blur(6px);
        padding: 8px; border-radius: 10px; box-shadow: 0 4px 18px rgba(0,0,0,.4);
        max-width: min(520px, calc(100vw - 24px));
      }
      #ac-wrap { position: relative; }
      #addressbar input {
        width: 320px; max-width: 52vw; padding: 7px 10px; border-radius: 7px;
        border: 1px solid #2a313b; background: #0e1318; color: #e6edf3; font-size: 14px;
      }
      #addressbar button {
        padding: 7px 14px; border-radius: 7px; border: 1px solid #2f6feb;
        background: #2f6feb; color: white; font-size: 14px; cursor: pointer;
      }
      #addressbar button:disabled { opacity: .5; cursor: default; }

      /* Language picker — top-right, just left of the controls panel */
      #lang-picker { position: fixed; top: 12px; right: 272px; z-index: 11; }
      #lang-trigger {
        display: flex; align-items: center; gap: 6px; line-height: 1;
        padding: 7px 10px; border-radius: 8px; cursor: pointer;
        border: 1px solid #2a313b; background: var(--panel-bg);
        backdrop-filter: blur(6px); color: #cdd6e0; font-size: 13px;
        box-shadow: 0 4px 18px rgba(0,0,0,.4); transition: border-color .15s, color .15s;
      }
      #lang-trigger:hover { border-color: #3a4250; color: #fff; }
      #lang-trigger .globe { font-size: 14px; }
      #lang-trigger .code { font-weight: 600; letter-spacing: .3px; }
      #lang-pop {
        position: absolute; top: calc(100% + 6px); right: 0; width: 240px;
        background: rgba(14, 19, 24, 0.98); border: 1px solid #2a313b; border-radius: 10px;
        box-shadow: 0 12px 32px rgba(0,0,0,.55); overflow: hidden;
      }
      #lang-pop[hidden] { display: none; }
      #lang-search {
        width: 100%; padding: 9px 11px; border: none; border-bottom: 1px solid #1b222c;
        background: #0e1318; color: #e6edf3; font-size: 13px; outline: none;
      }
      #lang-list { max-height: 340px; overflow-y: auto; }
      #lang-list::-webkit-scrollbar { width: 8px; }
      #lang-list::-webkit-scrollbar-thumb { background: #2a313b; border-radius: 4px; }
      .lang-item {
        display: flex; align-items: center; justify-content: space-between; gap: 10px;
        padding: 8px 11px; font-size: 13px; color: #cdd6e0; cursor: pointer;
      }
      .lang-item .lc { font-size: 11px; color: #6b7785; text-transform: uppercase; }
      .lang-item.current .name { color: #6cb1ff; }
      .lang-item.active { background: #1f6feb; color: #fff; }
      .lang-item.active .lc { color: #cfe0ff; }
      .lang-item.active .name { color: #fff; }

      #ac-list {
        position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20;
        background: rgba(14, 19, 24, 0.98); border: 1px solid #2a313b; border-radius: 8px;
        overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.5); display: none;
      }
      .ac-item {
        padding: 8px 10px; font-size: 13px; color: #cdd6e0; cursor: pointer;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        border-bottom: 1px solid #1b222c;
      }
      .ac-item:last-child { border-bottom: none; }
      .ac-item.active, .ac-item:hover { background: #1f6feb; color: #fff; }

      /* Pour-water tool — bottom-center toggle, clear of the side panels */
      #pour-trigger {
        position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
        z-index: 11; display: flex; align-items: center; gap: 7px; line-height: 1;
        padding: 10px 16px; border-radius: 999px; cursor: pointer;
        border: 1px solid #2a313b; background: var(--panel-bg);
        backdrop-filter: blur(6px); color: #cdd6e0; font-size: 14px;
        box-shadow: 0 4px 18px rgba(0,0,0,.4);
        transition: border-color .15s, color .15s, background .15s, box-shadow .15s;
        touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      }
      #pour-trigger:hover { border-color: #3a4250; color: #fff; }
      #pour-trigger .pour-icon { font-size: 16px; }
      #pour-trigger .pour-label { font-weight: 600; letter-spacing: .2px; }
      #pour-trigger.active {
        border-color: #2f6feb; background: #1f6feb; color: #fff;
        box-shadow: 0 4px 22px rgba(47,111,235,.55);
      }

      #pour-hint {
        position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
        z-index: 11; display: flex; align-items: center; gap: 10px;
        max-width: min(420px, calc(100vw - 24px));
        background: var(--panel-bg); backdrop-filter: blur(6px);
        padding: 8px 10px 8px 13px; border-radius: 10px; font-size: 13px;
        color: #e6edf3; box-shadow: 0 4px 18px rgba(0,0,0,.4);
        border-left: 3px solid #2f6feb;
      }
      #pour-hint[hidden] { display: none; }
      #pour-hint .pour-hint-text { line-height: 1.35; }
      #pour-hint .pour-hint-close {
        flex: none; width: 22px; height: 22px; padding: 0; border-radius: 6px;
        border: none; cursor: pointer; background: transparent; color: #9aa7b4;
        font-size: 17px; line-height: 1; transition: color .15s, background .15s;
        touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      }
      #pour-hint .pour-hint-close:hover { color: #fff; background: rgba(255,255,255,.08); }

      .poi-label {
        position: fixed; z-index: 8; pointer-events: none;
        transform: translate(-50%, -130%);
        background: rgba(229, 68, 58, 0.92); color: #fff;
        font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px;
        white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.5); display: none;
      }

      /* District marker: dark glass pill with a glowing red edge + note icon */
      .poi-district {
        position: fixed; z-index: 8; pointer-events: none; display: none;
        transform: translate(0, -100%);
        align-items: center; gap: 7px;
        background: rgba(16, 19, 26, 0.82); backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 86, 70, 0.85); border-radius: 999px;
        box-shadow: 0 0 16px rgba(255, 70, 55, 0.5), 0 2px 10px rgba(0,0,0,.55);
        color: #fff; font-size: 12px; font-weight: 600; letter-spacing: .2px;
        padding: 5px 12px 5px 6px; white-space: nowrap;
      }
      .poi-district .note {
        display: inline-flex; align-items: center; justify-content: center;
        width: 20px; height: 20px; border-radius: 50%;
        background: radial-gradient(circle at 50% 35%, #ff6f5d, #e5443a);
        color: #fff; font-size: 12px; line-height: 1;
        box-shadow: 0 0 10px rgba(255, 70, 55, 0.85);
      }
      .poi-leader {
        position: fixed; z-index: 7; pointer-events: none; display: none;
        height: 2px; transform-origin: left center;
        background: linear-gradient(90deg,
          rgba(255, 110, 90, 0.95) 0%, rgba(255, 86, 70, 0.55) 100%);
        box-shadow: 0 0 8px rgba(255, 70, 55, 0.7);
      }

      #toast {
        position: fixed; top: 64px; left: 12px; z-index: 10;
        background: var(--panel-bg); backdrop-filter: blur(6px);
        padding: 8px 12px; border-radius: 8px; font-size: 13px;
        max-width: min(520px, calc(100vw - 24px));
        opacity: 0; transition: opacity .25s; pointer-events: none;
        border-left: 3px solid #2f6feb;
      }
      #toast.show { opacity: 1; }
      #toast.error { border-left-color: #e5534b; }

      .tp-dfwv { z-index: 10 !important; }

      #credit {
        position: fixed; bottom: 6px; left: 8px; z-index: 9;
        font-size: 11px; color: rgba(255,255,255,.7);
        text-shadow: 0 1px 2px rgba(0,0,0,.8); pointer-events: none;
        display: none;
      }

      #readout {
        position: fixed; z-index: 11; pointer-events: none; display: none;
        background: rgba(18, 22, 28, 0.85); color: #e6edf3;
        padding: 5px 9px; border-radius: 6px; font-size: 12px;
        font-variant-numeric: tabular-nums; white-space: nowrap;
        box-shadow: 0 2px 10px rgba(0,0,0,.4);
      }

      #legend {
        position: fixed; bottom: 30px; left: 12px; z-index: 9; display: none;
        background: rgba(18, 22, 28, 0.82); padding: 8px 10px; border-radius: 8px;
        font-size: 11px; color: #e6edf3; box-shadow: 0 2px 10px rgba(0,0,0,.4);
      }
      #legend .title { margin-bottom: 5px; opacity: .85; }
      #legend .bar {
        width: 200px; height: 10px; border-radius: 3px;
        background: linear-gradient(to right,
          #07154d, #1f6fe5, #18c7c0, #3fdd54, #f2e020, #f58a1f, #d11414);
      }
      #legend .labels {
        display: flex; justify-content: space-between; margin-top: 3px;
        font-variant-numeric: tabular-nums;
      }

      #geo-legend {
        position: fixed; bottom: 30px; left: 12px; z-index: 9; display: none;
        background: rgba(18, 22, 28, 0.86); backdrop-filter: blur(6px);
        padding: 9px 11px; border-radius: 8px; color: #e6edf3;
        font-size: 11px; box-shadow: 0 2px 10px rgba(0,0,0,.45);
        max-width: 300px;
      }
      #geo-legend .title { font-weight: 600; margin-bottom: 6px; opacity: .9; }
      #geo-legend .row { display: flex; align-items: center; gap: 7px; margin: 2px 0; }
      #geo-legend .sw {
        width: 13px; height: 13px; border-radius: 3px; flex: 0 0 auto;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.15);
      }
      #geo-legend .nm { flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #geo-legend .dp { opacity: .7; font-variant-numeric: tabular-nums; white-space: nowrap; }
      #geo-legend .tg {
        font-size: 9px; padding: 1px 5px; border-radius: 999px; flex: 0 0 auto;
        text-transform: uppercase; letter-spacing: .3px;
      }
      #geo-legend .tg.soilgrids { background: rgba(63, 182, 224, .22); color: #8fdcf5; }
      #geo-legend .tg.model, #geo-legend .tg.crust1 { background: rgba(255,255,255,.10); color: #b9c2cc; }
      #geo-legend .row.wt .nm { color: #8fdcf5; }
      #geo-legend .caveat { margin-top: 7px; opacity: .6; font-size: 10px; line-height: 1.35; max-width: 280px; }

    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="addressbar">
      <div id="ac-wrap">
        <input id="address-input" type="text" placeholder="Enter an address or place…" autocomplete="off" spellcheck="false" />
        <div id="ac-list"></div>
      </div>
      <button id="address-go">Load</button>
    </div>
    <div id="toast"></div>
    <div id="credit">Imagery © Esri, Maxar, Earthstar Geographics &amp; the GIS User Community</div>
    <div id="readout"></div>
    <div id="legend">
      <div class="title">Elevation</div>
      <div class="bar"></div>
      <div class="labels"><span id="legend-min">0 m</span><span id="legend-max">0 m</span></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
